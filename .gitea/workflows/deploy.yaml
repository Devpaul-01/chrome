name: Deploy Backend
run-name: ${{ gitea.actor }} is deploying the backend
on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 #runs on node20, runner errors if node24 is used

      - name: Login to the Container Registry #github actor to mock context for login
        env:
          PAT_SECRET: ${{secrets.REGISTRY_PASSWORD}}
        run: |
          echo "Authenticating with Gitea Container Registry..."
          echo "$PAT_SECRET" | docker login gitea.birthdaymessaging.com -u ModaMetrics --password-stdin

      - name: Build and Push Docker image
        working-directory: backend
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea.birthdaymessaging.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          
          IMAGE_NAME=gitea.birthdaymessaging.io/ctmmediagroup/bm-legacy-backend
          SAFE_BRANCH_NAME=$(echo "${{ gitea.ref_name }}" | tr '/' '-')
          VERSION="${SAFE_BRANCH_NAME}-$(date +'%Y%m%d-%H%M%S')"

          echo "Building image $IMAGE_NAME:$VERSION"
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          echo "Pushing image $IMAGE_NAME:$VERSION"
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Trigger Coolify Deployment
        run: |
          echo "Telling Coolify to pull and deploy the new image..."
          # Actual Coolify Webhook URL when it is ready, using a placeholder for now
          curl -s -X GET "https://BIRTHDAY-MESSAGING-COOLIFY-INSTANCE.com/api/v1/deploy?uuid=TEAM_WEBHOOK_UUID"
      
      - name: Cleanup registry credentials
        if: always()
        run: |
          docker logout gitea.birthdaymessaging.com

