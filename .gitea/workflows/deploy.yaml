name: Deploy Backend

run-name: ${{ gitea.actor }} is deploying the backend

# runs when i push to these branches
on:
  push:
    branches:
      - develop
      - backend-ci-deploy

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest   # just spins up a linux machine

    steps:
      # grab my repo code
      - name: Checkout repo
        uses: actions/checkout@v4

      # run backend tests before building the image
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend dependencies
        working-directory: bm-ts/backend
        run: |
          pip install -e ".[test]"

      - name: Run backend tests
        working-directory: bm-ts/backend
        run: |
          python -m pytest --tb=short -q

      # log into gitea registry so i can push images
      - name: Login to registry
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea.birthdaymessaging.com -u "${{ secrets.REGISTRY_USER }}" --password-stdin

      # build the docker image and push it
      - name: Build + Push image
        working-directory: bm-ts/backend   # my backend folder (has Dockerfile)
        run: |
          IMAGE_NAME=gitea.birthdaymessaging.com/ctmmediagroup/bm-legacy-backend
          
          
          SAFE_BRANCH_NAME=$(echo "${GITHUB_REF_NAME}" | tr '/' '-')
          
          # version = branch + commit (so every build is unique)
          VERSION="${SAFE_BRANCH_NAME}-$(git rev-parse --short HEAD)"

          echo "building $IMAGE_NAME:$VERSION"

          docker build \
            -t $IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:latest \
            .

          echo "pushing to registry..."

          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      # tell coolify to redeploy with the new image
      - name: Trigger deploy
        run: |
          echo "triggering coolify..."
          curl -X GET "${{ secrets.COOLIFY_WEBHOOK_URL }}" -v

      # log out after everything (just cleanup)
      - name: Logout
        if: always()
        run: docker logout gitea.birthdaymessaging.com

