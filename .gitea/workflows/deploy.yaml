name: Deploy Backend
run-name: ${{ gitea.actor }} is deploying the backend
on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build and Push Docker image
        working-directory: backend
        run: |
          echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login gitea.birthdaymessaging.io -u "${{ secrets.REGISTRY_USER }}" --password-stdin
          
          IMAGE_NAME=gitea.birthdaymessaging.io/ctmmediagroup/bm-legacy-backend
          SAFE_BRANCH_NAME=$(echo "${{ gitea.ref_name }}" | tr '/' '-')
          VERSION="${SAFE_BRANCH_NAME}-$(date +'%Y%m%d-%H%M%S')"

          echo "Building image $IMAGE_NAME:$VERSION"
          docker build -t $IMAGE_NAME:$VERSION -t $IMAGE_NAME:latest .
          echo "Pushing image $IMAGE_NAME:$VERSION"
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Deploy container locally
        working-directory: backend
        run: |
          export DB_HOST="${{ secrets.DB_HOST }}"
          export DB_PORT="${{ secrets.DB_PORT }}"
          export DB_NAME="${{ secrets.DB_NAME }}"
          export DB_USER="${{ secrets.DB_USER }}"
          export DB_PASS="${{ secrets.DB_PASS }}"
          
          echo "Pulling latest image..."
          docker compose pull bm-legacy-backend
          echo "Restarting container..."
          docker compose up -d bm-legacy-backend
          echo "Cleanup old images..."
          docker image prune -f
      - name: Verify container health
        run: |
          CONTAINER_NAME="bm-legacy-backend"
          echo "Waiting for container $CONTAINER_NAME to stabilize..."
          sleep 15

          STATUS=$(docker inspect -f '{{.State.Status}}' $CONTAINER_NAME 2>/dev/null || echo "missing")
          RESTARTING=$(docker inspect -f '{{.State.Restarting}}' $CONTAINER_NAME 2>/dev/null || echo "false")

          if [ "$STATUS" != "running" ] || [ "$RESTARTING" = "true" ]; then
            echo "❌ Container $CONTAINER_NAME is not healthy. Status: $STATUS, Restarting: $RESTARTING"
            echo "Container logs:"
            docker logs --tail 50 $CONTAINER_NAME || true
            exit 1
          fi

          echo "✅ Container $CONTAINER_NAME is running normally."