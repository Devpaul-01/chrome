name: Backend CI
run-name: ${{ gitea.actor }} — backend CI (${{ gitea.ref_name }})

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  backend-ci:
    name: Pytest · Ruff · Mypy
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: bm-ts/backend

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install -e ".[test]"
          pip install ruff
          pip install -e ".[lint]"

      # ── Ruff lint ────────────────────────────────────────────────────────────
      - name: Ruff lint
        run: ruff check app/

      # ── Ruff format check ────────────────────────────────────────────────────
      - name: Ruff format check
        run: ruff format --check app/

      # ── Mypy type check ──────────────────────────────────────────────────────
      - name: Mypy type check
        run: mypy app/

      # ── Pytest ───────────────────────────────────────────────────────────────
      - name: Run tests
        run: python -m pytest --tb=short -q

  # ── Alembic migration up/down test (real PostgreSQL) ────────────────────
  migration-test:
    name: Alembic migrations (upgrade + downgrade)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: cipass
          POSTGRES_DB: bm_migrations_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    defaults:
      run:
        working-directory: bm-ts/backend

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:cipass@localhost:5432/bm_migrations_test
      JWT_SECRET_KEY: ci-test-only-secret-not-for-production-minimum32chars
      STRIPE_API_KEY: sk_test_ci_dummy_not_real
      SMTP_ENCRYPTION_KEY: ZmDfcTF7_60GrrY167zsiPd67pEvs0aGOv2oasOM1Pg=

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Python setup ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Install dependencies ─────────────────────────────────────────────────
      - name: Install dependencies
        run: pip install -e "."

      # ── Upgrade — apply all 11 migrations against clean PostgreSQL ───────────
      - name: Alembic upgrade head
        run: alembic upgrade head

      # ── Verify revision pointer ───────────────────────────────────────────────
      - name: Alembic current (verify head)
        run: alembic current

      # ── Downgrade — roll back all migrations to empty schema ─────────────────
      - name: Alembic downgrade base
        run: alembic downgrade base
