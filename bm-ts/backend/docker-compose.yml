services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-birthdaymessaging}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000" # Local dev only; Coolify manages port mapping in production
    volumes:
      - .:/app
    env_file:
      - .env
    # Dev override: single-worker uvicorn with hot-reload (bind-mount above)
    # Production uses Dockerfile CMD (gunicorn, 4 workers, no reload)
    command: >
      bash -c "
        alembic upgrade head &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "

  # Automated daily backup at 2:00 AM UTC
  db-backup:
    image: postgres:15
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backups:/backups
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    entrypoint: >
      bash -c "
        while true; do
          echo \"[$(date)] Running scheduled backup...\";
          pg_dump -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-birthdaymessaging} \ --format=plain --no-owner --no-privileges --clean --if-exists \ | gzip > /backups/birthdaymessaging_$$(date +%Y%m%d_%H%M%S).sql.gz;
          echo \"[$(date)] Backup complete. Pruning old backups (keeping last 7)...\";
          ls -t /backups/birthdaymessaging_*.sql.gz 2>/dev/null | tail -n +8 | xargs -r rm -f;
          echo \"[$(date)] Next backup in 24h.\";
          sleep 86400;
        done
      "
    restart: unless-stopped

volumes:
  postgres_data:
