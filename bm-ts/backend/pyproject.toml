[project]
name = "birthdaymessaging-backend"
version = "0.1.0"
description = "FastAPI backend for the BirthdayMessaging Chrome extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.22",
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-dotenv>=1.0",
    "stripe>=5.0",
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2",
    "psycopg[binary]>=3.1",
    "slowapi>=0.1.8",
    "alembic>=1.13",
    "sendgrid>=6.11"
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "pytest-cov>=4"
]

[tool.pytest.ini_options]
python_files = "tests/test_*.py"
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"
