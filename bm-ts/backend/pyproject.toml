[project]
name = "birthdaymessaging-backend"
version = "0.1.0"
description = "FastAPI backend for the BirthdayMessaging Chrome extension"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.22",
    "gunicorn>=22.0.0",
    "sqlalchemy>=2.0",
    "asyncpg>=0.28",
    "pyjwt[crypto]>=2.12.0",
    "passlib[argon2]>=1.7",
    "python-dotenv>=1.2.2",
    "stripe>=5.0",
    "pydantic>=2",
    "email-validator>=2",
    "pydantic-settings>=2",
    "slowapi>=0.1.8",
    "alembic>=1.13",
    "mako>=1.3.12",
    "sendgrid>=6.11",
    "sentry-sdk[fastapi]>=1.40",
    "cryptography>=46.0.7",
    "requests>=2.33.0",
    "werkzeug>=3.1.6",
    "python-multipart>=0.0.27"
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "pytest-cov>=4",
    "aiosqlite>=0.20"
]
db = [
    "psycopg[binary]>=3.1"
]
lint = [
    "mypy>=1.10",
    "types-passlib>=1.7"
]

[tool.pytest.ini_options]
python_files = "tests/test_*.py"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
exclude = ["alembic/", "app/tests/"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

