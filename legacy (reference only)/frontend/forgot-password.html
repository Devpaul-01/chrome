<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password</title>

  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./css/customCss.css">
  <link rel="stylesheet" href="./assets/toast.css">

  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <script src="./js/forgotpassword.js" defer></script>
</head>
<body>
  <div class="container">
    <h2>Forgot Your Password?</h2>
    <p>Enter your email and we’ll send a secure link to reset your password.</p>

    <label for="email">Email Address</label>
    <input type="email" id="email" placeholder="Enter your email" required>

    <button id="reset" type="button">Send Reset Link</button>

    <p>Remembered it? <a href="login.html">Back to Login</a></p>
  </div>
</body>
</html>
