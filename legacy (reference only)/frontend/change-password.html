        <div class="extBody forgotPasswordBody">
            <div class="formOuter">
                <h3 id="">Change Password</h3>

                <form action="">
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" name="password" class="form-control" id="password" placeholder=" Type in current Password">
                        <div class="form-error-message" id="errormsg1">Error </div>
                    </div>
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" name="password" class="form-control" id="newpassword" placeholder="Type in new Password">
                        <div class="form-error-message" id="errormsg2">Error </div>
                    </div>
                    <div class="form-group">
                        <label>Repeat New Password</label>
                        <input type="password" name="password" class="form-control" id="repeatnewpassword" placeholder="Repeat new Password">
                        <div class="form-error-message" id="errormsg3">Error </div>
                    </div>
                    
                    <div class="form-group">
                        <div class="form-error-message" id="errormsg4">Error </div><br>
                        <button class="btn footerBtn" type="button" id="submitNewPassword">
                            Reset password
                        </button>

                    </div>
                    <span id="errormsg1" class="error-message" ></span>
                    <span id="errormsg2" class="error-message" ></span>
                    <span id="errormsg3" class="error-message" ></span>

                    
                </form>
